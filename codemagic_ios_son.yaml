workflows:
  ios-release:
    name: Ezan Vakti Türkiye - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create iOS project with Podfile
        script: |
          rm -rf ios
          flutter create --platforms=ios --org com.ersantopkara --project-name ezan_vakti_turkiye .
          sed -i '' 's/com\.ersantopkara\.ezan_vakti_turkiye/com.ersantopkara.ezanvaktiturkiye/g' ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS without code signing
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - build/ios/iphoneos/**/*.app
