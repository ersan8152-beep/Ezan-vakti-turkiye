name: ezan_vakti_turkiye
description: Türkiye için namaz vakitleri, dualar, namaz rehberi ve kıble uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_device_compass: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/vakit_bildirimi.wav
