workflows:
  ios-release:
    name: Ezan Vakti Turkiye - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create fresh iOS project
        script: |
          rm -rf ios
          flutter create --platforms=ios --org com.ersantopkara --project-name ezan_vakti_turkiye .

      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure iOS 16 and Bundle ID
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Podfile")
          s = p.read_text()
          lines = s.splitlines()
          out = []
          found = False
          for line in lines:
              if line.lstrip().startswith("platform :ios"):
                  out.append("platform :ios, '16.0'")
                  found = True
              else:
                  out.append(line)
          if not found:
              out.insert(0, "platform :ios, '16.0'")
          p.write_text("\n".join(out) + "\n")

          x = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = x.read_text()
          import re
          s = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;", "IPHONEOS_DEPLOYMENT_TARGET = 16.0;", s)
          s = s.replace("com.ersantopkara.ezan_vakti_turkiye", "com.ersantopkara.ezanvaktiturkiye")
          x.write_text(s)
          PY

          echo "=== Podfile ==="
          sed -n '1,35p' ios/Podfile
          echo "=== Bundle IDs ==="
          grep -o "PRODUCT_BUNDLE_IDENTIFIER = [^;]*" ios/Runner.xcodeproj/project.pbxproj | sort -u

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate || true
          pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
