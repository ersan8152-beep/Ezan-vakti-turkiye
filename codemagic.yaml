workflows:
  ios-release:
    name: Ezan Vakti Turkiye - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create iOS project
        script: rm -rf ios && flutter create --platforms=ios --org com.ersantopkara --project-name ezan_vakti_turkiye .
      - name: Set iOS 13 and Bundle ID
        script: sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile && sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [^;]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g" ios/Runner.xcodeproj/project.pbxproj && sed -i '' "s/com\.ersantopkara\.ezan_vakti_turkiye/com.ersantopkara.ezanvaktiturkiye/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install --repo-update
      - name: Build iOS unsigned
        script: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
