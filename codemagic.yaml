workflows:
ios-release:
name: Ezan Vakti Türkiye - iOS
max_build_duration: 120
instance_type: mac_mini_m2

integrations:
app_store_connect: codemagic

environment:
flutter: stable
xcode: latest
cocoapods: default

ios_signing:
provisioning_profiles:
- "ezan_vakti_app_store_2"
certificates:
- "Ezan Vakti Türkiye"

scripts:
- name: Create iOS project
script: |
- name: Get Flutter packages
script: |
flutter pub get

- name: Configure Bundle ID
script: |
/usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ersantopkara.ezanvaktiturkiye" ios/Runner/
