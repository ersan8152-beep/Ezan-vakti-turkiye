workflows:
ios-release:
name: Ezan Vakti Türkiye - iOS
max_build_duration: 120
instance_type: mac_mini_m2

integrations:
app_store_connect: codemagic

environment:
flutter: stable
xcode: latest
cocoapods: default

ios_signing:
distribution_type: app_store
bundle_identifier: com.ersantopkara.ezanvaktiturkiye

scripts:
- name: Create iOS project
script: |
- name: Create iOS project
script: |
rm -rf ios
flutter create --platforms=ios --org com.ersantopkara --project-name ezan_vakti_turkiye .

- name: Get Flutter packages
script: |
flutter pub get

- name: Configure Bundle ID
script: |
/usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ersantopkara.ezanvaktiturkiye" ios/Runner/Info.plist

- name: Install CocoaPods dependencies
script: |
find . -name "Podfile" -execdir pod install \;

- name: Set up code signing
script: |
xcode-project use-profiles

- name: Build IPA
script: |
flutter build ipa --release \
--export-options-plist=/Users/builder/export_options.plist

artifacts:
- build/ios/ipa/*.ipa

publishing:
app_store_connect:
auth: integration
submit_to_testflight: true
submit_to_app_store: false
