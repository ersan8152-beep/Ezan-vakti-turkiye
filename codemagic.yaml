workflows:
  ios-release:
    name: Ezan Vakti Türkiye - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create iOS project
        script: |
          flutter create --platforms=ios --org com.ersantopkara .
          sed -i '' 's/com\.ersantopkara\.ezan_vakti_turkiye/com.ersantopkara.ezanvaktiturkiye/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS unsigned
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
