workflows:
  ios-release:
    name: Ezan Vakti Turkiye - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create iOS project
        script: |
          rm -rf ios
          flutter create --platforms=ios --org com.ersantopkara --project-name ezan_vakti_turkiye .

      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure Podfile
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path("ios/Podfile")
          s = podfile.read_text()

          s = re.sub(r"^\s*#?\s*platform\s*:ios.*$", "platform :ios, '16.0'", s, flags=re.MULTILINE)

          if "platform :ios" not in s:
              s = "platform :ios, '16.0'\n" + s

          post_install = r'''
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
              flutter_additional_ios_build_settings(target)
            end
          end
          '''

          s = re.sub(r"\npost_install do \|installer\|.*?^end\s*$", "", s, flags=re.MULTILINE | re.DOTALL)
          s = s.rstrip() + "\n" + post_install + "\n"
          podfile.write_text(s)

          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          x = pbx.read_text()
          x = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;", "IPHONEOS_DEPLOYMENT_TARGET = 16.0;", x)
          x = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", "PRODUCT_BUNDLE_IDENTIFIER = com.ersantopkara.ezanvaktiturkiye;", x)
          pbx.write_text(x)
          PY

          echo "=== Podfile platform ==="
          grep -n "platform :ios" ios/Podfile
          echo "=== Deployment targets ==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile ios/Runner.xcodeproj/project.pbxproj | head -20

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate || true
          pod install --repo-update --clean-install

      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
