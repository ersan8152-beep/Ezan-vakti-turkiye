workflows:
ios-release:
name: Ezan Vakti Türkiye - iOS
max_build_duration: 120
instance_type: mac_mini_m2

environment:
flutter: stable
xcode: latest
cocoapods: default

scripts:

- name: Create iOS project
script: |
rm -rf ios

flutter create \
--platforms=ios \
--org com.ersantopkara \
--project-name ezan_vakti_turkiye .

sed -i '' \
's/com\.ersantopkara\.ezan_vakti_turkiye/com.ersantopkara.ezanvaktiturkiye/g' \
ios/Runner.xcodeproj/project.pbxproj

echo "iOS project created"
ls -la ios

- name: Create Podfile
script: |
if [ ! -f ios/Podfile ]; then
cat > ios/Podfile <<'EOF'
platform :ios, '13.0'

ENV['COCOAPODS_DISABLE_STATS'] = 'true'

project 'Runner', {
'Debug' => :debug,
'Profile' => :release,
'Release' => :release,
}

def flutter_root
generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
unless File.exist?(generated_xcode_build_settings_path)
raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first"
end

File.foreach(generated_xcode_build_settings_path) do |line|
matches = line.match(/FLUTTER_ROOT\=(.*)/)
return matches[1].strip if matches
end

raise "FLUTTER_ROOT not found"
end

require File.expand_path(
File.join('packages', 'flutter_tools', 'bin', 'podhelper'),
flutter_root
)

flutter_ios_podfile_setup

target 'Runner' do
use_frameworks!

flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
end

post_install do |installer|
installer.pods_project.targets.each do |target|
flutter_additional_ios_build_settings(target)
end
end
EOF
fi

echo "Podfile:"
cat ios/Podfile

- name: Get Flutter packages
script: |
flutter pub get

- name: Install CocoaPods
script: |
cd ios
pod install --repo-update

- name: Build iOS
script: |
xcodebuild \
-workspace ios/Runner.xcworkspace \
-scheme Runner \
-configuration Release \
-sdk iphoneos \
CODE_SIGNING_ALLOWED=NO \
CODE_SIGNING_REQUIRED=NO \
build

artifacts:
- build/ios/iphoneos/**/*.app
- /tmp/xcodebuild_logs/*.log
